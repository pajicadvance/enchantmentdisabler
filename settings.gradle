pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven{
            url = "https://maven.kikugie.dev/releases"
        }
    }
}

plugins {
    id "dev.kikugie.stonecutter" version "0.3.+"
}

stonecutter {
    shared {
        versions "1.20.6", "1.20.2", "1.19.3", "1.19"
        vcsVersion = "1.20.2"
    }

    create rootProject
}